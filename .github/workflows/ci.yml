name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install matplotlib      # eval harness plot (offline)
      - name: Run tests
        run: pytest -q
      - name: Run evaluation harness (offline) and print report
        run: python -m eval.run
